name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack uploaded source (if any)
        run: |
          if [ -f source.zip ]; then unzip -o -q source.zip; fi
          ls -la

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Xcode version
        run: xcodebuild -version

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project MyLife.xcodeproj \
            -scheme MyLife \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MyLife.app Payload/
          zip -qry MyLife.ipa Payload
          ls -la MyLife.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.2.${{ github.run_number }}"
          gh release create "$TAG" MyLife.ipa \
            --title "我的一生模拟器 My Life Simulator $TAG" \
            --notes "点下面的 MyLife.ipa 下载，然后用万能签签名安装。Download MyLife.ipa below and sign it to install."

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyLife-ipa
          path: MyLife.ipa

      - name: Save build log to ci-logs branch
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ci"
          if [ -f build.log ]; then
            grep -nE "error:|fatal error|\*\* BUILD|Undefined symbol|linker command failed" build.log > "$RUNNER_TEMP/ci/errors.txt" || true
            grep -nE -B2 -A6 "error:" build.log | head -n 1500 > "$RUNNER_TEMP/ci/error_context.txt" || true
            tail -n 120 build.log > "$RUNNER_TEMP/ci/tail.txt" || true
          else
            echo "no build.log" > "$RUNNER_TEMP/ci/errors.txt"
          fi
          echo "${{ job.status }} run=${{ github.run_number }} sha=${{ github.sha }}" > "$RUNNER_TEMP/ci/status.txt"
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan ci-logs-tmp
          git rm -rf --cached . -q || true
          cp "$RUNNER_TEMP"/ci/*.txt .
          git add -f errors.txt error_context.txt tail.txt status.txt 2>/dev/null || git add -f errors.txt tail.txt status.txt
          git commit -q -m "CI log run ${{ github.run_number }}"
          git push -f origin HEAD:ci-logs

  android:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Bundle the game into the APK
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -R web/. android/app/src/main/assets/www/

      - name: Build signed APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.2.${{ github.run_number }}
          KS_PASS: ${{ secrets.ANDROID_KS_PASS }}
        run: |
          if [ -z "$KS_PASS" ]; then export KS_PASS="$(cat keystore/password.txt)"; fi
          if [ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"; export KS_FILE="$RUNNER_TEMP/release.jks"; fi
          gradle --no-daemon assembleRelease 2>&1 | tee ../android-build.log
          cp app/build/outputs/apk/release/app-release.apk "../MyLife-1.2.${{ github.run_number }}.apk"
          ls -la ..

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v1.2.${{ github.run_number }}" "MyLife-1.2.${{ github.run_number }}.apk" --clobber

      - name: Save Android build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log
