plugins { id 'com.android.application' }

def vCode = (System.getenv("VERSION_CODE") ?: "1") as int
def vName = System.getenv("VERSION_NAME") ?: "1.2.0"
def ksPass = System.getenv("KS_PASS") ?: ""

android {
    namespace 'com.wodeyisheng.mylife'
    compileSdk 34
    defaultConfig {
        applicationId "com.wodeyisheng.mylife"
        minSdk 24
        targetSdk 34
        versionCode vCode
        versionName vName
    }
    signingConfigs {
        release {
            storeFile file(System.getenv("KS_FILE") ?: "../keystore/release.jks")
            storePassword ksPass
            keyAlias "mylife"
            keyPassword ksPass
            enableV1Signing true
            enableV2Signing true
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
